<!DOCTYPE html>
<html>

<head>
    <title>Age 18+ Login Form</title>
    <style>
        body {
            font-family: Arial;
            margin: 50px;
        }

        .container {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        button {
            width: 100%;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login Form</h2>

        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Age:</label>
        <input type="number" id="age" placeholder="Enter your age">

        <button onclick="validateForm()">Login</button>

        <p id="message"></p>
    </div>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value.trim();
            let age = parseInt(document.getElementById("age").value);
            let message = document.getElementById("message");

            if (name === "") {
                message.style.color = "red";
                message.textContent = "Please enter your name.";
                return;
            }

            if (isNaN(age)) {
                message.style.color = "red";
                message.textContent = "Please enter your age.";
                return;
            }

            if (age < 18) {
                message.style.color = "red";
                message.textContent = "You must be at least 18 years old to log in.";
            } else {
                message.style.color = "green";
                message.textContent = "Login successful! Welcome, " + name + ".";
            }
        }
    </script>

</body>

</html>
